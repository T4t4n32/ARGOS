<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MANGO / ARGOS - Cámara Raspberry Pi</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #0b1117; color: #e8eef5; display: grid; min-height: 100vh; place-items: center; }
    main { width: min(980px, 94vw); padding: 24px; }
    .card { background: #121b25; border: 1px solid #233142; border-radius: 22px; padding: 22px; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 4vw, 2.3rem); }
    p { color: #b8c7d8; line-height: 1.55; }
    video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; border: 1px solid #26364a; }
    code { background: #0b1117; border: 1px solid #26364a; border-radius: 8px; padding: 2px 6px; }
    .status { margin-top: 14px; font-size: .95rem; color: #9fb0c4; }
    .grid { display: grid; gap: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Vista en vivo - Cámara CSI NoIR</h1>
      <p>Conéctate al hotspot de la Raspberry Pi y abre esta página. Si el video no carga en Chrome/Edge, revisa que el instalador haya descargado <code>hls.min.js</code> localmente o abre la playlist con VLC.</p>
      <video id="video" controls autoplay muted playsinline></video>
      <div class="grid">
        <div class="status" id="status">Cargando stream HLS...</div>
        <p>Playlist directa: <code>/cam/stream.m3u8</code></p>
      </div>
    </section>
  </main>
  <script src="/assets/hls.min.js"></script>
  <script>
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const src = '/cam/stream.m3u8';

    function setStatus(text) { statusEl.textContent = text; }

    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ lowLatencyMode: true, liveSyncDuration: 2 });
      hls.loadSource(src);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setStatus('Stream conectado usando hls.js local.');
        video.play().catch(() => setStatus('Stream listo. Presiona reproducir.'));
      });
      hls.on(Hls.Events.ERROR, (_, data) => {
        setStatus('Error HLS: ' + data.type + ' / ' + data.details + '. Verifica el servicio mango-camera-hls.');
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = src;
      video.addEventListener('loadedmetadata', () => {
        setStatus('Stream conectado con soporte HLS nativo del navegador.');
        video.play().catch(() => setStatus('Stream listo. Presiona reproducir.'));
      });
    } else {
      setStatus('Este navegador no soporta HLS local. Usa VLC con http://' + location.host + src + ' o instala hls.js local durante el setup.');
    }
  </script>
</body>
</html>
